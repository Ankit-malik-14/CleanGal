name: CleanGal
options:
  bundleIdPrefix: com.cleangal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CleanGal:
    type: application
    platform: iOS
    sources:
      - path: CleanGal
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleangal.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: CleanGal/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CleanGal/Resources/Info.plist
      properties:
        UILaunchScreen: {}
